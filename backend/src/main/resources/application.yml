server:
  port: 8080

spring:
  application:
    name: demo-app

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  output:
    ansi:
      enabled: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo_app.**.model
  configuration:
    map-underscore-to-camel-case: true

tts:
  api-url: ${LOCAL_TTS_URL}

upstage:
  api-key: ${UPSTAGE_API_KEY}
  api-url: ${UPSTAGE_API_URL}
  model-name: ${UPSTAGE_MODEL_NAME}

langchain4j:
  openai:
    chat-model:
      base-url: ${upstage.api-url}
      api-key: ${upstage.api-key}
      model-name: ${upstage.model-name}
      log-requests: true
      log-responses: true
