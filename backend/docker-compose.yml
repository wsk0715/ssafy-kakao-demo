services:
  mysql:
    image: mysql:8.0
    container_name: demo-mysql
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    ports:
      - "3316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 6s
    networks:
      - demo-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: demo-app
    container_name: demo-app
    restart: no
    env_file:
      - .env
      - .secret.env
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - demo-network

volumes:
  mysql_data:

networks:
  demo-network:
    external: true
